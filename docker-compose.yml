services:
  # 1. DATABASE: PostgreSQL Hash Storage
  sentinel-db:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-vic_hashes}
    volumes:
      - sentinel-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sentinel-lan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_admin} -d ${POSTGRES_DB:-vic_hashes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. The Core Hardware-Accelerated LLM Backend
  inference-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-inference-node
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./mock_evidence:/evidence:ro
      - ./models:/models:ro
    command: ["--model", "/models/qwen2.5-coder-7b-instruct-ghidra-v2-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "8192", "--parallel", "4"]
    networks:
      - sentinel-lan

  # 3. The CJIS-Compliant API & WebUI
  middleware-ui:
    build:
      context: .
      dockerfile: Dockerfile.services
    container_name: sentinel-middleware
    restart: unless-stopped
    environment:
      - LLAMA_API_URL=${LLAMA_API_URL:-http://inference-engine:8080/completion}
      - DATABASE_URL=${DATABASE_URL:-postgresql://sentinel_admin:secure_local_password@sentinel-db:5432/vic_hashes}
    ports:
      - "3000:3000"
    volumes:
      - ./knowledge_graph_exports:/app/knowledge_graph_exports
      - ./cjis_audit.log:/app/cjis_audit.log
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3000"]
    depends_on:
      sentinel-db:
        condition: service_healthy
      inference-engine:
        condition: service_started
    networks:
      - sentinel-lan

  # 4. The Automated Project VIC Watchdog
  media-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.services
    container_name: sentinel-media-pipeline
    restart: unless-stopped
    volumes:
      - ./mock_evidence:/app/mock_evidence:ro
    command: ["python", "media_pipeline.py"]
    depends_on:
      sentinel-db:
        condition: service_healthy
    networks:
      - sentinel-lan

networks:
  sentinel-lan:
    driver: bridge

volumes:
  sentinel-db-data:
